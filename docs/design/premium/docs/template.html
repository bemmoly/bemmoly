<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bemmoly Docs Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;450;500;550;600;650&display=swap" rel="stylesheet">
<style>
:root{
  --r-bg:#eceef2; --r-panel:#ffffff; --r-line:#dfe2e8; --r-tx:#141922; --r-tx2:#505869; --r-tx3:#7a8292;
  --r-acc:#2356C9; --r-acc-bg:#eaf0fd; --r-cur:#c2410c; --r-cur-bg:#fff1e8; --r-pro:#1f7a44; --r-pro-bg:#e6f5ec;
  --r-s3:#d92d2d; --r-s2:#d97706; --r-s1:#7a8292; --r-shadow:0 1px 2px rgba(16,24,40,.06),0 0 0 1px rgba(16,24,40,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --r-bg:#0b0d11; --r-panel:#14171d; --r-line:#252a33; --r-tx:#e8ebf1; --r-tx2:#a6aebb; --r-tx3:#6f7786;
    --r-acc:#7b95ec; --r-acc-bg:rgba(91,123,229,.16); --r-cur:#fb923c; --r-cur-bg:rgba(251,146,60,.13); --r-pro:#4ade80; --r-pro-bg:rgba(74,222,128,.12); --r-shadow:0 0 0 1px rgba(255,255,255,.07); }
}
:root[data-theme="dark"]{ --r-bg:#0b0d11; --r-panel:#14171d; --r-line:#252a33; --r-tx:#e8ebf1; --r-tx2:#a6aebb; --r-tx3:#6f7786;
    --r-acc:#7b95ec; --r-acc-bg:rgba(91,123,229,.16); --r-cur:#fb923c; --r-cur-bg:rgba(251,146,60,.13); --r-pro:#4ade80; --r-pro-bg:rgba(74,222,128,.12); --r-shadow:0 0 0 1px rgba(255,255,255,.07); }
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--r-bg);color:var(--r-tx);font:13.5px/1.5 'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit}
.top{display:flex;align-items:center;gap:16px;height:60px;padding:0 20px;background:var(--r-panel);border-bottom:1px solid var(--r-line);flex:none}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand b{font-weight:600;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.brand small{color:var(--r-tx3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtoggle{margin:0 auto;display:inline-flex;padding:3px;border-radius:11px;background:var(--r-bg);box-shadow:inset 0 0 0 1px var(--r-line)}
.rtoggle button{border:0;background:transparent;height:34px;padding:0 16px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-weight:550;color:var(--r-tx2);white-space:nowrap}
.rtoggle button i{width:8px;height:8px;border-radius:50%}
.rtoggle button[data-m="cur"] i{background:var(--r-cur)}
.rtoggle button[data-m="pro"] i{background:var(--r-pro)}
.rtoggle button[data-m="split"] i{background:linear-gradient(90deg,var(--r-cur) 50%,var(--r-pro) 50%)}
.rtoggle button.on{background:var(--r-panel);color:var(--r-tx);box-shadow:var(--r-shadow)}
.rtoggle button:focus-visible,.rtabs button:focus-visible,.opt:focus-visible{outline:2px solid var(--r-acc);outline-offset:2px}
.opts{display:flex;align-items:center;gap:12px;color:var(--r-tx2);font-size:12.5px}
.opt{display:inline-flex;align-items:center;gap:6px;cursor:pointer;border:0;background:transparent;padding:6px 8px;border-radius:7px}
.opt:hover{background:var(--r-bg)}
.kbd{font-family:'IBM Plex Mono',monospace;font-size:11px;border:1px solid var(--r-line);border-radius:4px;padding:0 5px;color:var(--r-tx3);background:var(--r-panel)}
.rtabs{display:flex;gap:2px;padding:8px 16px;background:var(--r-panel);border-bottom:1px solid var(--r-line);overflow-x:auto;flex:none;scrollbar-width:none}
.rtabs button{border:0;background:transparent;height:30px;padding:0 12px;border-radius:7px;cursor:pointer;color:var(--r-tx2);white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.rtabs button:hover{background:var(--r-bg)}
.rtabs button.on{background:var(--r-acc-bg);color:var(--r-acc);font-weight:600}
.rtabs .n{font-size:11px;color:var(--r-tx3);font-variant-numeric:tabular-nums}
.rtabs .sep{width:1px;background:var(--r-line);margin:6px 6px}
.body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 400px}
.stage{overflow:auto;padding:22px 24px 40px;min-width:0}
.cap{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-size:12.5px;color:var(--r-tx2);flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:12px;font-weight:600;font-size:11.5px;letter-spacing:.02em}
.badge.cur{background:var(--r-cur-bg);color:var(--r-cur)}
.badge.pro{background:var(--r-pro-bg);color:var(--r-pro)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.fw{position:relative;border-radius:12px;overflow:hidden;box-shadow:0 1px 2px rgba(16,24,40,.08),0 12px 40px rgba(16,24,40,.12),0 0 0 1px rgba(16,24,40,.08);background:#fff;margin:0 auto}
.fw .fi{transform-origin:0 0;position:absolute;left:0;top:0}
.fw img{display:block}
.pins{position:absolute;inset:0;pointer-events:none}
.pin{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff;pointer-events:auto;cursor:pointer;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3);transition:transform .15s}
.pin.s3{background:var(--r-s3)} .pin.s2{background:var(--r-s2)} .pin.s1{background:#64748b} .pin.p{background:#1f7a44}
.pin.hl{transform:scale(1.35);z-index:3}
.pin.hl::after{content:'';position:absolute;inset:-9px;border-radius:50%;border:2px solid currentColor;opacity:.0;animation:ring 1s ease-out infinite}
.pin.s3.hl::after{color:var(--r-s3)} .pin.s2.hl::after{color:var(--r-s2)} .pin.p.hl::after{color:#1f7a44}
@keyframes ring{0%{opacity:.8;transform:scale(.8)}100%{opacity:0;transform:scale(1.5)}}
body.nopins .pins{display:none}
.notes{background:var(--r-panel);border-left:1px solid var(--r-line);overflow:auto;padding:20px 20px 40px}
.notes h2{font-size:17px;font-weight:600;letter-spacing:-.01em;margin:0 0 6px}
.verdict{font-size:13.5px;color:var(--r-tx2);margin:0 0 16px;line-height:1.55}
.legend{display:flex;gap:12px;font-size:11.5px;color:var(--r-tx3);margin:0 0 12px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:50%}
.note{display:grid;grid-template-columns:26px 1fr;gap:10px;padding:11px 10px;border-radius:10px;cursor:default;margin:0 -10px}
.note:hover,.note.hl{background:var(--r-bg)}
.note .num{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;margin-top:1px}
.note .num.s3{background:var(--r-s3)} .note .num.s2{background:var(--r-s2)} .note .num.s1{background:#64748b} .note .num.p{background:#1f7a44}
.note b{display:block;font-weight:600;font-size:13.5px;margin-bottom:2px}
.note p{margin:0;color:var(--r-tx2);font-size:13px;line-height:1.5}
.sevtag{font-size:10.5px;font-weight:600;letter-spacing:.02em;margin-left:6px;text-transform:uppercase}
.sevtag.s3{color:var(--r-s3)} .sevtag.s2{color:var(--r-s2)} .sevtag.s1{color:var(--r-tx3)}
.notes h3{font-size:12px;font-weight:600;color:var(--r-tx3);margin:18px 0 6px;text-transform:uppercase;letter-spacing:.04em}
.foot{font-size:12px;color:var(--r-tx3);margin-top:24px;border-top:1px solid var(--r-line);padding-top:14px;line-height:1.55}
.doc{max-width:980px;margin:0 auto;background:var(--r-panel);border-radius:14px;box-shadow:var(--r-shadow);padding:36px 44px 48px}
.doc h1{font-size:26px;letter-spacing:-.02em;margin:0 0 6px}
.doc h2{font-size:18px;margin:32px 0 10px;letter-spacing:-.01em}
.doc p{color:var(--r-tx2);margin:0 0 10px}
.doc table{width:100%;border-collapse:collapse;font-size:13px}
.doc th{text-align:left;font-weight:600;color:var(--r-tx3);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;padding:8px 10px;border-bottom:1px solid var(--r-line)}
.doc td{padding:10px;border-bottom:1px solid var(--r-line);vertical-align:top}
.score{display:inline-flex;gap:3px}
.score i{width:14px;height:6px;border-radius:3px;background:var(--r-line)}
.score.c i.f{background:var(--r-cur)} .score.p i.f{background:var(--r-pro)}
.phase{border:1px solid var(--r-line);border-radius:12px;padding:16px 18px;margin:12px 0}
.phase h3{margin:0 0 4px;font-size:15px;display:flex;align-items:center;gap:8px}
.phase ul{margin:8px 0 0;padding-left:18px;color:var(--r-tx2)} .phase li{margin:5px 0}
.phase code,.doc code{font-family:'IBM Plex Mono',monospace;font-size:12px;background:var(--r-bg);padding:1px 5px;border-radius:4px}
.chipp{font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;background:var(--r-acc-bg);color:var(--r-acc)}
.sheet{width:1440px;padding:40px 48px;background:#f3f4f7}
.sheet h3{font:600 20px/1.3 'IBM Plex Sans',sans-serif;margin:0 0 4px;color:#161b26;letter-spacing:-.01em}
.sheet .s{color:#4b5264;font:14px 'IBM Plex Sans',sans-serif;margin-bottom:24px}
.sheet .g{display:grid;grid-template-columns:repeat(4,1fr);gap:26px 22px}
.th{display:flex;flex-direction:column;gap:8px}
.th .box{width:322px;height:201px;border-radius:8px;overflow:hidden;position:relative;box-shadow:0 0 0 1px rgba(16,24,40,.1),0 4px 14px rgba(16,24,40,.08);background:#fff}
.th .box > *{transform:scale(.2236);transform-origin:0 0;position:absolute;left:0;top:0}
.th .box img{width:1440px;height:900px}
.th .t{font:600 13px 'IBM Plex Sans',sans-serif;color:#161b26}
.th .k{display:flex;gap:6px;flex-wrap:wrap}
.th .k span{font:500 11px 'IBM Plex Sans',sans-serif;padding:2px 7px;border-radius:5px}
.k .bad{background:#fdecec;color:#b42323} .k .ok{background:#e6f5ec;color:#1f7a44} .k .neu{background:#eceef2;color:#4b5264}
.sbar{height:6px;border-radius:3px;display:flex;overflow:hidden;background:#e1e4ea}
@media (max-width: 1100px){ .body{grid-template-columns:1fr} .notes{border-left:0;border-top:1px solid var(--r-line)} body{overflow:auto} .body{overflow:visible} .stage{overflow:visible} }
@media (max-width: 700px){ .top{flex-wrap:wrap;height:auto;padding:10px 16px;gap:10px} .rtoggle{margin:0} .brand small,.opts .hint{display:none} .stage{padding:16px} .split{grid-template-columns:1fr} }
.ix p{margin:8px 0 4px;color:var(--r-tx2);font-size:13px;line-height:1.5}
.ix p b{color:var(--r-tx);font-weight:600}
.ix ol{margin:0 0 4px;padding-left:20px;color:var(--r-tx2);font-size:13px;line-height:1.55}
.ix table{width:100%;border-collapse:collapse;font-size:12.5px;color:var(--r-tx2);margin:2px 0 6px}
.ix td{padding:5px 8px 5px 0;vertical-align:top;border-bottom:1px solid var(--r-line);line-height:1.45}
.ix td:first-child{white-space:nowrap;width:1%;color:var(--r-tx)}
.ix td b{font-weight:550}
{{KIT_CSS}}
</style>
</head>
<body>
<div class="top">
  <div class="brand">{{MARK}}<div style="min-width:0"><b>Bemmoly design review · Docs</b><br><small>Docs on main · 0.3.0 (ef15018) · Oct 10, 2026 · screenshots from the running app</small></div></div>
  <div class="rtoggle" role="tablist" aria-label="Version">
    <button data-m="cur" role="tab"><i></i>Current</button>
    <button data-m="pro" role="tab"><i></i>Proposed</button>
    <button data-m="split" role="tab"><i></i>Side by side</button>
  </div>
  <div class="opts"><button class="opt" id="pinsBtn" aria-pressed="true">◉ Markers</button><span class="hint"><span class="kbd">Space</span> flip · <span class="kbd">←</span><span class="kbd">→</span> screens</span></div>
</div>
<nav class="rtabs" id="tabs"></nav>
<div class="body">
  <section class="stage" id="stage"></section>
  <aside class="notes" id="notes"></aside>
</div>
<script>
const IMGS = {{IMGS}};
</script>
<script>
{{SCRIPTS}}
</script>
</body>
</html>
