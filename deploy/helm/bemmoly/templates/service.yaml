apiVersion: v1
kind: Service
metadata:
  name: {{ include "bemmoly.name" . }}
  labels:
    {{- include "bemmoly.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  sessionAffinity: {{ .Values.service.sessionAffinity }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: {{ ternary "api" "all" (eq .Values.mode "split") }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
