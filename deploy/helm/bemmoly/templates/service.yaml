apiVersion: v1
kind: Service
metadata:
  name: {{ include "bemmoly.name" . }}
  labels:
    {{- include "bemmoly.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: {{ ternary "api" "all" (eq .Values.mode "split") }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
---
{{- if .Values.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "bemmoly.name" . }}-data
  labels:
    {{- include "bemmoly.labels" . | nindent 4 }}
spec:
  # Split mode needs ReadWriteMany (or S3 for attachments) so api and worker share files.
  accessModes: [{{ ternary "ReadWriteMany" "ReadWriteOnce" (eq .Values.mode "split") }}]
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
{{- end }}
---
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "bemmoly.name" . }}
  labels:
    {{- include "bemmoly.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tlsSecret }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tlsSecret }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "bemmoly.name" . }}
                port:
                  name: http
{{- end }}
