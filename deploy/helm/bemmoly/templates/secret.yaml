{{- include "bemmoly.validate" . -}}
{{- if not .Values.existingSecret }}
{{- $name := include "bemmoly.secretName" . -}}
{{- /* Values generated once and read back on every upgrade: a new BEMMOLY_SECRET_KEY would
     make every stored credential unreadable, a new POSTGRES_PASSWORD would lock the app out
     of the database it initialised. */ -}}
{{- $old := dict -}}
{{- with lookup "v1" "Secret" .Release.Namespace $name }}{{ $old = .data | default dict }}{{ end -}}
{{- $pgPassword := index $old "POSTGRES_PASSWORD" | default "" | b64dec | default (randAlphaNum 32) -}}
{{- $databaseUrl := .Values.externalDatabase.url -}}
{{- if .Values.postgresql.enabled -}}
{{- $databaseUrl = printf "postgres://bemmoly:%s@%s:5432/bemmoly_db" $pgPassword (include "bemmoly.postgresHost" .) -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "bemmoly.labels" . | nindent 4 }}
  annotations:
    # Uninstalling keeps it: the database and backups are unreadable without this key.
    # Installing again under the same release name adopts it.
    helm.sh/resource-policy: keep
type: Opaque
data:
  BEMMOLY_SECRET_KEY: {{ index $old "BEMMOLY_SECRET_KEY" | default (randAscii 32 | b64enc | b64enc) }}
  BEMMOLY_BACKUP_PASSPHRASE: {{ index $old "BEMMOLY_BACKUP_PASSPHRASE" | default (randAlphaNum 32 | b64enc) }}
  DATABASE_URL: {{ $databaseUrl | b64enc }}
  {{- if .Values.postgresql.enabled }}
  POSTGRES_PASSWORD: {{ $pgPassword | b64enc }}
  {{- end }}
{{- end }}
