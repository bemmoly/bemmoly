# Bemmoly on one machine. The installer writes this file to /var/bemmoly with .env
# beside it; every value below comes from .env. To run it by hand: copy env.template to
# .env, fill it in, then `docker compose up -d` in the same folder.
#
# Optional services are Compose profiles, listed in COMPOSE_PROFILES in .env:
#   db       the bundled Postgres 18 (omit it and set DATABASE_URL for an external one)
#   proxy    Caddy with automatic HTTPS (omitted with --no-proxy)
#   updater  in-app updates (omitted with --no-in-app-updates; the CLI still works)
#   pdf      the PDF renderer (headless Chromium) for Export as PDF; set
#            BEMMOLY_PDF_URL=http://pdf:3000 with it. Without it PDF is the browser's print view.
name: bemmoly

services:
  bemmoly:
    image: ${BEMMOLY_IMAGE:-ghcr.io/bemmoly/bemmoly}:${VERSION:?VERSION is not set in .env}
    restart: unless-stopped
    env_file: .env
    environment:
      BEMMOLY_DATA_DIR: /var/bemmoly/data
      BEMMOLY_BACKUP_DIR: /var/bemmoly/backups
    volumes:
      - ./data:/var/bemmoly/data
      - ./backups:/var/bemmoly/backups
    # Loopback only behind the proxy; the installer opens it with --no-proxy.
    ports:
      - ${BEMMOLY_HTTP_BIND:-127.0.0.1:8080}:8080
    depends_on:
      db:
        condition: service_healthy
        required: false
    healthcheck:
      test: ['CMD', 'bemmoly-health']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s
    stop_grace_period: 30s
    networks: [internal, pdf]

  db:
    image: pgvector/pgvector:pg18
    profiles: [db]
    restart: unless-stopped
    environment:
      POSTGRES_USER: bemmoly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set in .env}
      POSTGRES_DB: bemmoly_db
    # Tuned by the installer from this machine's memory.
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-512MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-1536MB}
    shm_size: 256mb
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/18/docker.
      - ./pg:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bemmoly -d bemmoly_db']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    stop_grace_period: 60s
    networks: [internal]

  proxy:
    image: caddy:2.11
    profiles: [proxy]
    restart: unless-stopped
    environment:
      BEMMOLY_DOMAIN: ${BEMMOLY_DOMAIN:?BEMMOLY_DOMAIN is not set in .env}
      BEMMOLY_TLS_MODE: ${BEMMOLY_TLS_MODE:-auto}
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/data:/data
      - ./caddy/config:/config
    depends_on: [bemmoly]
    networks: [internal]

  updater:
    image: ${UPDATER_IMAGE:-ghcr.io/bemmoly/updater}:${UPDATER_VERSION:-${VERSION}}
    profiles: [updater]
    restart: unless-stopped
    # The Docker socket is root-equivalent: no published port, read-only, token only.
    environment:
      UPDATER_TOKEN: ${UPDATER_TOKEN:?UPDATER_TOKEN is not set in .env}
      BEMMOLY_DIR: ${BEMMOLY_DIR:-/var/bemmoly}
      COMPOSE_PROJECT: bemmoly
      APP_SERVICE: bemmoly
      BEMMOLY_IMAGE: ${BEMMOLY_IMAGE:-ghcr.io/bemmoly/bemmoly}
      UPDATER_IMAGE: ${UPDATER_IMAGE:-ghcr.io/bemmoly/updater}
      BEMMOLY_UPDATER_SELF_UPDATE: ${BEMMOLY_UPDATER_SELF_UPDATE:-true}
      BEMMOLY_ALLOW_UNSIGNED_UPDATES: ${BEMMOLY_ALLOW_UNSIGNED_UPDATES:-false}
      BEMMOLY_UPDATER_LOCAL_IMAGES: ${BEMMOLY_UPDATER_LOCAL_IMAGES:-false}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${BEMMOLY_DIR:-/var/bemmoly}:${BEMMOLY_DIR:-/var/bemmoly}
    read_only: true
    tmpfs: [/tmp]
    security_opt: ['no-new-privileges:true']
    networks: [internal]

  # Optional (ADR 0034). The app sends whole documents with images inline; the renderer
  # resolves no host, loads nothing but data: and its own temp files, and sits alone on a
  # network with no route out. Chromium is contained by the container: non-root, read-only,
  # no capabilities, no new privileges, bounded memory and processes.
  pdf:
    image: ${PDF_IMAGE:-gotenberg/gotenberg:8.37.0-chromium@sha256:0d28ae9a96441588ef739623726bd500ad0720b77266c6f1351a13e333fbd61c}
    profiles: [pdf]
    restart: unless-stopped
    command:
      - gotenberg
      - --api-timeout=60s
      - --chromium-auto-start=true
      - --chromium-disable-javascript=true
      - --chromium-allow-list=^(file:///tmp/|data:)
      - --chromium-deny-public-ips=true
      - --chromium-deny-private-ips=true
      - --chromium-host-resolver-rules=MAP * ~NOTFOUND
      - --chromium-max-queue-size=8
      - --chromium-restart-after=50
      - --webhook-disable=true
      - --prometheus-disable-collect=true
    read_only: true
    tmpfs: [/tmp, /home/gotenberg]
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 1g
    pids_limit: 512
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:3000/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [pdf]

# One network for the stack. It is not marked `internal: true` because the app reaches
# AI providers and SMTP, and the updater verifies signatures; nothing on it is published
# except the proxy's 80 and 443 (and the app on loopback).
networks:
  internal: {}
  # The renderer's own network: internal, so nothing on it reaches beyond the app.
  pdf:
    internal: true
