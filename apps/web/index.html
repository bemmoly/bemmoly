<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Bemmoly: your work. Your platform." />
    <title>Bemmoly</title>
    <!-- Generated by the design system's brand:icons script into packages/ui/assets/brand/generated. -->
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <!-- The first paint: the Bemmoly mark over a quiet bar, drawn by the stylesheet alone (boot-frame.ts). -->
    <div id="boot" class="fixed inset-0 z-50 grid place-items-center bg-canvas" aria-hidden="true">
      <div class="flex flex-col items-center gap-5">
        <span class="inline-flex h-14 shrink-0 [&>svg]:h-full [&>svg]:w-auto">
          <!-- boot:logo -->
        </span>
        <span class="block h-1 w-30 overflow-hidden rounded-full bg-line">
          <span class="block h-full w-2/5 rounded-full bg-acc motion-safe:animate-pulse"></span>
        </span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
