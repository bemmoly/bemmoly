# payments-worker in prod, release v2.1.0, as Pipelines last deployed it.
application: payments-worker
revision: payments-worker-v2-1-0-a1c9e3f
release: v2.1.0
image: us-central1-docker.pkg.dev/bemmoly-control-583920174411/apps/payments-worker@sha256:4f1c2a9e0b7d6c5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e
