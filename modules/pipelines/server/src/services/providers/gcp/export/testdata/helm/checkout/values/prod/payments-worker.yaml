        key: STRIPE_KEY
secrets:
  - path: STRIPE_KEY
    resourceName: projects/acme-prod-7f3a/secrets/bemmoly-payments-worker-STRIPE_KEY-prod/versions/1
stableService: payments-worker
route:
  hostname: payments-worker.checkout.bemmoly.internal
  parent:
    name: bemmoly
    namespace: checkout
gateway:
  create: false
frontDoor:
  neg: fd-checkout-payments-worker-v2-1-0-a1c9e3f-80
