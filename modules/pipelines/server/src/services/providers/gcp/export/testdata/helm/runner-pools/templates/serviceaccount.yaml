{{- if .Values.pool }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bemmoly-runner
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    pipelines.bemmoly.dev/pool: {{ .Values.pool }}
  annotations:
    iam.gke.io/gcp-service-account: {{ .Values.serviceAccount }}
{{- end }}
