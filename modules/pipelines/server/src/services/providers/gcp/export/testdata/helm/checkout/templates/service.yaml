{{- if .Values.application }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.revision }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bemmoly.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    pipelines.bemmoly.dev/revision: {{ .Values.revision }}
  ports:
    - name: http
      port: 80
      targetPort: {{ .Values.port }}
{{- end }}
