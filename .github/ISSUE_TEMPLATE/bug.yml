name: Bug report
description: Something does not work as designed.
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Security problems go to GitHub's private reporting (SECURITY.md),
        not here. Questions go to Discussions › Q&A. Remove secrets, tokens and personal data
        from anything you paste.
  - type: checkboxes
    id: searched
    attributes:
      label: Before you file
      options:
        - label: I searched the open and closed issues and did not find this one.
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Settings › People
        2. Invite someone with an address that has a plus sign
        3. ...
    validations:
      required: true
  - type: input
    id: reference
    attributes:
      label: Reference from the error message
      description: Error messages show a reference (the request id). It finds the server log line.
      placeholder: 0199b1a2-7c3d-7e4f-8a5b-6c7d8e9f0a1b
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in Settings › System, or by `bemmoly status`.
      placeholder: 0.5.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Where you saw it
      options:
        - The live demo (bemmoly.com/demo)
        - Installer (curl get.bemmoly.com, Compose with Caddy)
        - Docker Compose by hand
        - Helm
        - Air-gapped bundle
        - Running from source (pnpm dev)
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Server and browser
      description: The server's OS and size for install problems; the browser and version for UI problems.
      placeholder: Ubuntu 24.04, 2 vCPU, 4 GB; Firefox 140
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: From `bemmoly logs`, filtered by the reference if you have one.
      render: shell
