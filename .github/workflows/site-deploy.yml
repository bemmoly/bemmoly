name: Site deploy

# Redeploys bemmoly.com once a release is published. Coolify builds the site on every push to
# main, but the version the site shows is capped at the newest published GitHub release
# (apps/site/src/lib/changelog.ts), and the version pull request merges before the release
# workflow publishes that release. Without this, the site would keep naming the previous
# version until the next unrelated push.
#
# The release workflow calls this after it publishes (a release created with GITHUB_TOKEN
# raises no `release` event); `release: published` covers a release published by hand.
# Pre-releases never count as the site's version, so they do not redeploy it.
#
# Repository secrets (Coolify › the site's application › Webhooks, and Keys & Tokens):
#   COOLIFY_SITE_DEPLOY_URL  the application's deploy webhook, https://<coolify>/api/v1/deploy?uuid=… (called with POST)
#   COOLIFY_TOKEN            an API token with the deploy permission

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      version:
        description: The release just published, X.Y.Z
        required: true
        type: string
    secrets:
      COOLIFY_SITE_DEPLOY_URL:
        required: false
      COOLIFY_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: The published release the site should show, X.Y.Z
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Redeploy the site
    if: ${{ github.event_name != 'release' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION: ${{ inputs.version || github.event.release.tag_name }}
      SITE_URL: https://bemmoly.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the version
        run: |
          VERSION="${VERSION#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error title=Not a stable release::\"$VERSION\" is not X.Y.Z."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # The site asks GitHub for the newest release while it builds, and GitHub can go on
      # answering the previous one for a short while after a release is published. Building
      # before it catches up bakes the old version into the site, so wait for it first.
      - name: Wait until GitHub calls this release the latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 30); do
            LATEST="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)"
            if [ "${LATEST#v}" = "$VERSION" ]; then
              echo "GitHub names v$VERSION the latest release."
              exit 0
            fi
            echo "GitHub still names ${LATEST:-nothing} the latest; waiting."
            sleep 20
          done
          echo "::error title=Release not latest::GitHub does not name v$VERSION the latest release after 10 minutes."
          exit 1

      # Coolify answers a deploy request with the deployment it queued; follow it to the end,
      # and ask again (without the build cache) when it fails, up to three attempts.
      - name: Redeploy with Coolify and follow the deployment
        env:
          DEPLOY_URL: ${{ secrets.COOLIFY_SITE_DEPLOY_URL }}
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$DEPLOY_URL" ] || [ -z "$TOKEN" ]; then
            echo "::error title=Site not redeployed::Set the COOLIFY_SITE_DEPLOY_URL and COOLIFY_TOKEN secrets, then run Site deploy with version $VERSION."
            exit 1
          fi
          API="$(printf '%s' "$DEPLOY_URL" | sed -E 's#^(https?://[^/]+).*#\1#')/api/v1"
          url="$DEPLOY_URL"
          for attempt in 1 2 3; do
            answer="$(curl --fail-with-body --silent --show-error --max-time 60 --retry 3 --retry-all-errors \
              -X POST -H "Authorization: Bearer $TOKEN" "$url")"
            id="$(printf '%s' "$answer" | jq -r '.deployments[0].deployment_uuid // empty')"
            echo "Coolify queued deployment ${id:-?} (attempt $attempt)."
            if [ -z "$id" ]; then
              echo "::error title=No deployment::Coolify did not name a deployment."
              exit 1
            fi
            # When Coolify will not say how the deployment went (the token cannot read it, or an
            # older Coolify), stop following after a minute: the live-site check below decides,
            # and asking again would only queue more deployments behind this one.
            status=queued
            unknown=0
            for _ in $(seq 1 60); do
              sleep 15
              code="$(curl --silent --max-time 30 -o deployment.json -w '%{http_code}' \
                -H "Authorization: Bearer $TOKEN" "$API/deployments/$id" || echo 000)"
              status="$(jq -r '.status // "unknown"' deployment.json 2>/dev/null || echo unknown)"
              rm -f deployment.json
              case "$status" in
                finished) echo "Deployment $id finished."; exit 0 ;;
                failed | cancelled*) break ;;
                queued | in_progress) unknown=0 ;;
                *)
                  unknown=$((unknown + 1))
                  if [ "$unknown" -ge 4 ]; then
                    echo "::warning title=Deployment not followed::Coolify answered HTTP $code for deployment $id, so the live site decides."
                    exit 0
                  fi
                  ;;
              esac
            done
            # Only the id and status: this repository's logs are public, and Coolify's build log
            # can carry build-time values. The log itself is in Coolify, under that deployment.
            echo "::warning title=Deployment $status::Coolify deployment $id ended $status (attempt $attempt); its log is in Coolify."
            case "$DEPLOY_URL" in
              *force=*) url="$(printf '%s' "$DEPLOY_URL" | sed -E 's/force=[a-z]+/force=true/')" ;;
              *\?*) url="$DEPLOY_URL&force=true" ;;
              *) url="$DEPLOY_URL?force=true" ;;
            esac
          done
          echo "::error title=Site not redeployed::Coolify failed to deploy the site three times; the deployments named above have their logs in Coolify."
          exit 1

      # llms.txt names the site's version in one sentence (apps/site/src/pages/llms.txt.ts).
      - name: Wait until the live site names the release
        run: |
          for _ in $(seq 1 20); do
            if curl --fail --silent --max-time 20 "$SITE_URL/llms.txt" \
              | grep -Fq "The current release is $VERSION."; then
              echo "$SITE_URL shows $VERSION."
              exit 0
            fi
            sleep 30
          done
          echo "::error title=Site still stale::$SITE_URL/llms.txt does not name $VERSION 10 minutes after the deployment finished."
          exit 1

      - uses: ./.github/actions/setup

      - name: Build the site
        run: pnpm turbo run build --filter=@bemmoly/site

      - name: Tell IndexNow
        run: pnpm --filter @bemmoly/site indexnow
