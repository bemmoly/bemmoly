name: CI

# Job names are the required status checks for main; see .github/CI.md before renaming one.

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'
  ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12

jobs:
  fast:
    name: Fast checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Restore the Turborepo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-fast-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-fast-${{ runner.os }}-

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test

      - name: Lint workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo "$ACTIONLINT_IMAGE" -color

  full:
    name: Full checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: bemmoly
          POSTGRES_PASSWORD: bemmoly
          POSTGRES_DB: bemmoly_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bemmoly -d bemmoly_db"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Restore the Turborepo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-full-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-full-${{ runner.os }}-

      - name: Integration tests
        run: pnpm test:integration
        env:
          BEMMOLY_TEST_DATABASE_URL: postgres://bemmoly:bemmoly@localhost:5432/bemmoly_db

      - name: Build (server, web shell and Storybook)
        run: pnpm build

      - name: Size budget
        run: pnpm size

      - name: Read the Playwright version
        id: playwright
        working-directory: apps/web
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install the Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @bemmoly/web exec playwright install --with-deps chromium

      - name: Install the browser's system libraries
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @bemmoly/web exec playwright install-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/web/test-results
          retention-days: 7

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LHCI_VERSION: 0.15.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Build the web shell
        run: pnpm turbo run build --filter=@bemmoly/web

      - name: Generate a throwaway secret key for the server
        run: echo "BEMMOLY_SECRET_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Lighthouse budgets (FCP under 1.2 s, cold, 4G)
        run: pnpm dlx "@lhci/cli@${LHCI_VERSION}" autorun --config=tools/lighthouse/lighthouserc.cjs
        env:
          PORT: '4320'
          BEMMOLY_PUBLIC_URL: http://127.0.0.1:4320
          LOG_LEVEL: info

      - name: Upload the Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse
          path: .lighthouseci
          retention-days: 7
          if-no-files-found: ignore
