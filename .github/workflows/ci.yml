name: CI

# Job names are the required status checks for main; see .github/CI.md before renaming one.
# "Fast checks" and "Full checks" are gates over the parallel jobs below them, so branch
# protection keeps matching the same two names however the work is split.

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'
  ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12

jobs:
  # ---- Fast checks ---------------------------------------------------------------------------

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          turbo-cache: typecheck

      - name: Typecheck
        run: pnpm typecheck

  lint:
    name: Lint, format, catalogs and workflows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          turbo-cache: lint

      - name: Lint
        run: pnpm lint

      - name: Format
        if: ${{ !cancelled() }}
        run: pnpm format:check

      - name: Message catalogs
        if: ${{ !cancelled() }}
        run: pnpm i18n:check

      - name: Lint workflows
        if: ${{ !cancelled() }}
        run: docker run --rm -v "$PWD:/repo" -w /repo "$ACTIONLINT_IMAGE" -color

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          turbo-cache: unit

      - name: Unit tests
        run: pnpm test

  eval:
    name: AI evals
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          turbo-cache: eval

      - name: AI evals against the recordings
        run: pnpm eval

  fast:
    name: Fast checks
    if: ${{ always() }}
    needs: [typecheck, lint, unit, eval]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every fast check passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != success ]; then exit 1; fi
          done

  # ---- Full checks ---------------------------------------------------------------------------

  integration:
    # Every package with integration tests receives the same --shard=i/n through turbo, so
    # each package's test files are split n ways and the n shards together run each file
    # exactly once.
    name: Integration tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: bemmoly
          POSTGRES_PASSWORD: bemmoly
          POSTGRES_DB: bemmoly_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bemmoly -d bemmoly_db"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          turbo-cache: integration-${{ matrix.shard }}

      - name: Postgres 18 client tools for the backup tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-18

      - name: Integration tests
        run: pnpm turbo run test:integration -- --shard="$SHARD/4"
        env:
          SHARD: ${{ matrix.shard }}
          BEMMOLY_TEST_DATABASE_URL: postgres://bemmoly:bemmoly@localhost:5432/bemmoly_db
          BEMMOLY_TEST_PG_BIN_DIR: /usr/lib/postgresql/18/bin

  container:
    name: The bemmoly command in a container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          turbo-cache: container

      - name: The bemmoly command follows its release, in a container
        run: pnpm --filter @bemmoly/deploy test:container

  build:
    name: Build and size budget
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          turbo-cache: build

      - name: Build (server, web shell and Storybook)
        run: pnpm build

      - name: Size budget
        run: pnpm size

  e2e:
    # Each shard builds the web shell itself (turbo's test:e2e depends on build) and serves it;
    # Playwright's --shard splits the spec files so the three shards run each test once.
    name: End-to-end tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          turbo-cache: e2e-${{ matrix.shard }}

      - uses: ./.github/actions/playwright
        with:
          package: '@bemmoly/web'
          directory: apps/web

      - name: End-to-end tests
        run: pnpm turbo run test:e2e -- --shard="$SHARD/3"
        env:
          SHARD: ${{ matrix.shard }}

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.shard }}
          path: apps/web/test-results
          retention-days: 7

  full:
    name: Full checks
    if: ${{ always() }}
    needs: [integration, container, build, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every full check passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != success ]; then exit 1; fi
          done

  # ---- Other required checks -----------------------------------------------------------------

  work-e2e:
    name: Work end to end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: bemmoly
          POSTGRES_PASSWORD: bemmoly
          POSTGRES_DB: bemmoly_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bemmoly -d bemmoly_db"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          turbo-cache: work-e2e

      - uses: ./.github/actions/playwright
        with:
          package: '@bemmoly/e2e'
          directory: apps/e2e

      # Builds the web app, then starts the server from the checkout against the service
      # Postgres, enables Work and Docs through the CLI and runs the flows (Docs' among them),
      # the module toggle and the board budget. The budget numbers are printed in the log.
      - name: Work flows against a real server
        run: pnpm test:e2e:work
        env:
          BEMMOLY_TEST_DATABASE_URL: postgres://bemmoly:bemmoly@localhost:5432/bemmoly_db

      - name: Upload the Playwright report and the server log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: work-e2e-report
          path: |
            apps/e2e/test-results
            apps/e2e/.state/server.log
          retention-days: 7
          if-no-files-found: ignore

  a11y:
    name: Accessibility (${{ matrix.theme }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        theme: [bemmoly, graphite, sand, pine, contrast]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Build the web shell
        run: pnpm turbo run build --filter=@bemmoly/web

      - name: Read the Playwright version
        id: playwright
        working-directory: apps/web
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install the Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @bemmoly/web exec playwright install --with-deps chromium

      - name: Install the browser's system libraries
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @bemmoly/web exec playwright install-deps chromium

      # Every screen through axe (all rules, contrast included) in this theme, light and dark,
      # at desktop and 390px, then the keyboard, focus and semantics checks. Any violation fails.
      - name: WCAG 2.2 AA audit
        run: pnpm --filter @bemmoly/web test:a11y
        env:
          A11Y_THEME: ${{ matrix.theme }}

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: a11y-report-${{ matrix.theme }}
          path: apps/web/test-results
          retention-days: 7

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LHCI_VERSION: 0.15.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Build the web shell
        run: pnpm turbo run build --filter=@bemmoly/web

      - name: Generate a throwaway secret key for the server
        run: echo "BEMMOLY_SECRET_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Lighthouse budgets (FCP under 1.2 s, cold, 4G)
        run: pnpm dlx "@lhci/cli@${LHCI_VERSION}" autorun --config=tools/lighthouse/lighthouserc.cjs
        env:
          PORT: '4320'
          BEMMOLY_PUBLIC_URL: http://127.0.0.1:4320
          LOG_LEVEL: info

      - name: Upload the Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse
          path: .lighthouseci
          retention-days: 7
          if-no-files-found: ignore
