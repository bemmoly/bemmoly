name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: bemmoly
          POSTGRES_PASSWORD: bemmoly
          POSTGRES_DB: bemmoly_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bemmoly -d bemmoly_db"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test

      - name: Integration tests
        run: pnpm test:integration
        env:
          BEMMOLY_TEST_DATABASE_URL: postgres://bemmoly:bemmoly@localhost:5432/bemmoly_db

      - name: Build
        run: pnpm build

      - name: Size budget
        run: pnpm size

      - name: Install Playwright browser
        run: pnpm --filter @bemmoly/web exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/test-results
          retention-days: 7
