name: Site IndexNow

# Tells the IndexNow engines to recrawl bemmoly.com after a change to the site lands on main.
# Coolify deploys from the same push; IndexNow only queues the URLs, so an early ping is fine.
on:
  push:
    branches: [main]
    paths: ['apps/site/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # Waits for the deploy, then retries so a slow build does not lose the ping.
      - name: Submit the sitemap to IndexNow
        run: |
          sleep 300
          for attempt in 1 2 3 4 5 6; do
            node apps/site/scripts/indexnow.ts && exit 0
            sleep 120
          done
          exit 1
