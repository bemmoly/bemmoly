packages:
  - apps/*
  - packages/*
  - modules/*
  - tools/*
  - deploy
  - deploy/updater
  - perf

allowBuilds:
  cpu-features: false
  esbuild: true
  protobufjs: false
  sharp: false
  ssh2: false

engineStrict: true

# The editor's ProseMirror packages, held at releases at least two weeks old when they were added,
# and the SAML library's XML parser, held at the release that fixes its published advisories.
overrides:
  '@xmldom/xmldom': 0.8.15
  prosemirror-changeset: 2.4.3
  prosemirror-history: 1.5.0
  prosemirror-transform: 1.12.1
  prosemirror-view: 1.42.5
